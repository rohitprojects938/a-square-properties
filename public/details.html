<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Property Details - House Rental</title>
  <link rel="stylesheet" href="/css/style.v143.css">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <!-- Leaflet CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .slider-container {
      width: 100%;
      height: 240px;
      position: relative;
      background: #000;
    }
    .slider-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    .spec-item {
      background: var(--accent-gray);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .spec-item i {
      color: var(--primary-red);
      font-size: 20px;
    }
    .spec-item span {
      font-size: 11px;
      color: var(--text-muted);
    }
    .spec-item strong {
      font-size: 13px;
      color: var(--text-dark);
    }
    #map {
      height: 200px;
      border-radius: var(--border-radius);
      margin: 16px 0;
      z-index: 1;
    }
    .owner-card {
      background: var(--accent-gray);
      border-radius: var(--border-radius);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }
    .action-bar-sticky {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 88px;
      padding-bottom: 14px;
      background: white;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-left: 16px;
      padding-right: 16px;
      z-index: 9999;
    }
    .app-content {
      padding: 0 !important;
      padding-bottom: 96px !important;
    }
    .action-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      text-decoration: none;
      color: white;
      box-shadow: var(--soft-shadow);
      cursor: pointer;
    }
    .emi-card {
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 16px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    
    <!-- Floating Back & Favorite buttons -->
    <a href="/search.html" class="floating-back-btn">
      <i class="bx bx-left-arrow-alt" style="font-size:24px;"></i>
    </a>
    <button class="favorite-btn" id="details-fav-btn" style="position:absolute; top:16px; right:16px; z-index:10; background:white;">
      <i class="bx bx-heart"></i>
    </button>

    <!-- Details App Content Scroll -->
    <!-- Details App Content Scroll -->
    <div class="app-content">
      
      <!-- Left Column (Property Details) -->
      <div class="desktop-main-col" style="display:flex; flex-direction:column; gap:16px;">
        <!-- Image slider -->
        <div class="slider-container" id="details-image-slider" style="position:relative; aspect-ratio:16/9; overflow:hidden;">
          <img class="slider-img" id="slider-img-target" src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80" style="width:100%; height:100%; object-fit:cover; transition: opacity 0.2s ease;">
          
          <button type="button" onclick="navigateDetailsImage(-1)" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.5); color:white; border:none; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2;"><i class="bx bx-chevron-left" style="font-size:24px;"></i></button>
          <button type="button" onclick="navigateDetailsImage(1)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.5); color:white; border:none; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2;"><i class="bx bx-chevron-right" style="font-size:24px;"></i></button>
        </div>

        <!-- Thumbnails row -->
        <div id="details-thumbnails-row" style="display:flex; gap:8px; overflow-x:auto; padding:8px 16px; scrollbar-width:none;">
          <!-- Thumbnails loaded dynamically -->
        </div>

        <!-- Information Summary block -->
        <div style="padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
            <div>
              <h2 style="font-size:20px; font-weight:800; color:var(--text-dark);" id="details-title">Loading property...</h2>
              <p style="font-size:12px; color:var(--text-muted); margin-top:2px;" id="details-address"><i class="bx bx-map"></i> Loading address...</p>
            </div>
            <h2 style="font-size:22px; font-weight:800; color:var(--primary-red); white-space:nowrap;" id="details-price">₹0.00</h2>
          </div>

          <!-- Listed On Section -->
          <div id="details-listed-on-container" style="display:none; align-items:center; gap:12px; margin: 8px 0 16px 0; padding: 10px 14px; background: var(--accent-gray); border: 1px solid var(--border-color); border-radius: 12px; font-family: 'Outfit', sans-serif; box-sizing: border-box; width: fit-content;">
            <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); font-weight:600;">
              <i class="bx bx-calendar" style="font-size:15px; color:var(--primary-red);"></i>
              <span>Listed on: <span style="color:var(--text-dark);" id="details-listed-date">-</span></span>
            </div>
            <div style="width:1px; height:12px; background:var(--border-color);"></div>
            <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); font-weight:600;">
              <i class="bx bx-time-five" style="font-size:15px; color:var(--primary-red);"></i>
              <span>Time: <span style="color:var(--text-dark);" id="details-listed-time">-</span></span>
            </div>
          </div>

          <span class="verified-badge" style="position:static; display:inline-flex; margin-bottom:16px;">
            <i class="bx bxs-badge-check"></i> RERA Approved
          </span>

          <!-- Specifications grid -->
          <h3 style="font-size:16px; font-weight:700;">Property Highlights</h3>
          <div class="specs-grid">
            <div class="spec-item">
              <i class="bx bx-bed"></i>
              <span>Bedrooms</span>
              <strong id="spec-beds">-</strong>
            </div>
            <div class="spec-item">
              <i class="bx bx-bath"></i>
              <span>Bathrooms</span>
              <strong id="spec-baths">-</strong>
            </div>
            <div class="spec-item">
              <i class="bx bx-compass"></i>
              <span>Facing</span>
              <strong id="spec-facing">-</strong>
            </div>
            <div class="spec-item">
              <i class="bx bx-building"></i>
              <span>Floor</span>
              <strong id="spec-floor">-</strong>
            </div>
            <div class="spec-item">
              <i class="bx bx-car"></i>
              <span>Parking</span>
              <strong id="spec-parking">-</strong>
            </div>
            <div class="spec-item">
              <i class="bx bx-chair"></i>
              <span>Furnishing</span>
              <strong id="spec-furnish">-</strong>
            </div>
          </div>

          <!-- Description -->
          <h3 style="font-size:16px; font-weight:700; margin-top:20px;">Description</h3>
          <p style="font-size:13px; color:var(--text-muted); line-height:1.6; margin-top:6px;" id="details-description">
            Loading property description...
          </p>

          <!-- Location Leaflet Map -->
          <h3 style="font-size:16px; font-weight:700; margin-top:20px;">Map Location</h3>
          <div id="map"></div>

          <!-- Owner card profile summary -->
          <div class="owner-card">
            <div style="display:flex; align-items:center; gap:12px;">
              <img id="owner-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80" style="width:48px; height:48px; border-radius:50%; object-fit:cover;">
              <div>
                <h4 id="owner-name">Manoj Soni</h4>
                <p style="font-size:11px; color:var(--text-muted);" id="owner-tag">Premium Builder</p>
              </div>
            </div>
            <span style="background:var(--primary-red); color:white; font-size:9px; font-weight:700; padding:4px 8px; border-radius:8px;">OWNER</span>
          </div>

        </div>
      </div>

      <!-- Right Column (Desktop Dashboard Quick Actions) -->
      <div class="desktop-right-panel desktop-only" style="padding-top:16px;">
        <!-- Quick actions -->
        <div class="desktop-panel-section">
          <h4 class="desktop-panel-title"><i data-lucide="zap"></i> Quick Actions</h4>
          <button class="btn-primary" id="desktop-compare-btn" style="width:100%; padding:12px; border-radius:12px; font-weight:700; border:none; color:white; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
            <i data-lucide="git-compare"></i> Add to Compare
          </button>
          <button class="btn-secondary" id="desktop-share-btn" style="width:100%; padding:12px; border-radius:12px; font-weight:700; border:1px solid var(--border-color); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; background:white;">
            <i data-lucide="share-2"></i> Share Property
          </button>
        </div>

        <!-- Recently viewed widget -->
        <div class="desktop-panel-section">
          <h4 class="desktop-panel-title"><i data-lucide="clock"></i> Recently Viewed</h4>
          <div id="desktop-recent-details-widget" style="display:flex; flex-direction:column; gap:12px;">
            <!-- Loaded dynamically from localStorage -->
          </div>
        </div>
      </div>

    </div>

    <!-- Contact Sticky Action Bar -->
    <div class="action-bar-sticky">
      <!-- Call Owner -->
      <a href="#" class="action-circle-btn" style="background:#0071e3;" id="call-action-btn">
        <i class="bx bxs-phone"></i>
      </a>
      <!-- WhatsApp chat -->
      <a href="#" class="action-circle-btn" style="background:#25D366;" id="whatsapp-action-btn" target="_blank">
        <i class="bx bxl-whatsapp" style="font-size:24px;"></i>
      </a>
      <!-- Share link -->
      <button class="action-circle-btn" style="background:#FF9F0A;" onclick="handleShareLink()">
        <i class="bx bx-share-alt"></i>
      </button>
    </div>

  </div>

  <script src="/js/main.v143.js"></script>
  <script>
    let propertyId = null;
    let propertyDetails = null;

    function trackRecentlyViewed(property) {
      if (!property) return;
      try {
        const key = 'recently_viewed';
        let items = [];
        const raw = localStorage.getItem(key);
        if (raw) {
          items = JSON.parse(raw);
        }
        items = items.filter(item => item.id != property.id);
        const coverImg = (property.images && property.images.length > 0) ? property.images[0].image_url : null;
        items.unshift({
          id: property.id,
          title: property.title,
          price: property.price,
          city: property.city,
          cover_image: coverImg
        });
        if (items.length > 10) {
          items = items.slice(0, 10);
        }
        localStorage.setItem(key, JSON.stringify(items));
      } catch (e) {
        console.error('Error tracking recently viewed:', e);
      }
    }

    function formatListedDate(dateStr) {
      if (!dateStr) return null;
      try {
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return null;
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const day = date.getDate();
        const month = months[date.getMonth()];
        const year = date.getFullYear();
        let hours = date.getHours();
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const strTime = String(hours).padStart(2, '0') + ':' + minutes + ' ' + ampm;
        return {
          date: `${day} ${month} ${year}`,
          time: strTime
        };
      } catch (e) {
        console.error('Error formatting date:', e);
        return null;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      propertyId = urlParams.get('id');
      if (propertyId) {
        loadPropertyDetails();
      }
    });

    async function loadPropertyDetails() {
      try {
        const result = await apiRequest(`/api/properties/${propertyId}`);
        if (result.success) {
          propertyDetails = result.data;
          
          // Set text titles
          document.getElementById('details-title').innerText = propertyDetails.title;
          document.getElementById('details-address').innerHTML = `<i class="bx bx-map"></i> ${propertyDetails.address}, ${propertyDetails.city}`;
          document.getElementById('details-price').innerText = `₹${formatPrice(propertyDetails.price)}`;
          document.getElementById('details-description').innerText = propertyDetails.description;

          // Set Listed On details
          const dateInfo = formatListedDate(propertyDetails.created_at || propertyDetails.listed_at);
          const listedOnContainer = document.getElementById('details-listed-on-container');
          if (dateInfo && listedOnContainer) {
            document.getElementById('details-listed-date').innerText = dateInfo.date;
            document.getElementById('details-listed-time').innerText = dateInfo.time;
            listedOnContainer.style.display = 'flex';
          } else if (listedOnContainer) {
            document.getElementById('details-listed-date').innerText = 'Unknown';
            document.getElementById('details-listed-time').innerText = '--';
            listedOnContainer.style.display = 'flex';
          }

          // Set Spec items
          document.getElementById('spec-beds').innerText = window.SafeRender.safeText(propertyDetails.bedrooms, '0') + ' BHK';
          document.getElementById('spec-baths').innerText = window.SafeRender.safeText(propertyDetails.bathrooms, '0');
          document.getElementById('spec-facing').innerText = window.SafeRender.safeText(propertyDetails.facing, 'East');
          document.getElementById('spec-floor').innerText = window.SafeRender.safeText(propertyDetails.floor_number, '0');
          document.getElementById('spec-parking').innerText = window.SafeRender.safeText(propertyDetails.parking_spaces, '0');
          document.getElementById('spec-furnish').innerText = window.SafeRender.safeText(propertyDetails.furnishing_status, 'unfurnished').toUpperCase();

          // Set Gallery Images & Swipe Setup
          activeImageIndex = 0;
          renderGallery();
          setupSwipeListeners();

          // Set Owner Cards
          const ownerNameText = window.SafeRender.safeText(propertyDetails.owner_name, 'Owner');
          const ownerRoleText = window.SafeRender.safeText(propertyDetails.owner_role, 'Agent').toUpperCase();
          const ownerPhoneText = window.SafeRender.safeText(propertyDetails.owner_phone, '');

          // Prefer the listing's own contact_phone; fall back to owner's profile phone
          const contactPhone = (propertyDetails.contact_phone || ownerPhoneText || '').replace(/[^0-9+]/g, '');

          document.getElementById('owner-name').innerText = ownerNameText;
          document.getElementById('owner-tag').innerText = `Direct ${ownerRoleText} ${contactPhone ? '• ' + contactPhone : ''}`;

          const ownerAvatar = document.getElementById('owner-avatar');
          if (ownerAvatar) {
            ownerAvatar.src = window.SafeRender.safeAvatar({
              name: ownerNameText,
              profile_photo: propertyDetails.owner_pic
            }, 'Owner');
            ownerAvatar.setAttribute('data-fallback-initials', window.AvatarSystem.getInitialsDataUri(ownerNameText));
            ownerAvatar.onerror = function() { window.AvatarSystem.handleImageError(this); };
          }

          // Set Call / WhatsApp links using listing's contact_phone
          const waMessage = encodeURIComponent(`Hi,\nI found your property on HouseRenter.in.\nI am interested in your property listing.\nIs it still available?\n\nPlease share more details.`);
          document.getElementById('call-action-btn').href = contactPhone ? `tel:${contactPhone}` : '#';
          document.getElementById('whatsapp-action-btn').href = contactPhone
            ? `https://wa.me/${contactPhone.replace('+', '')}?text=${waMessage}`
            : '#';

          // Setup Favorite icon status
          checkFavStatus();

          // Setup Map Location Drop (Leaflet OSM)
          const lat = parseFloat(propertyDetails.latitude) || 17.385; // Default Hyderabad lat
          const lng = parseFloat(propertyDetails.longitude) || 78.486; // Default Hyderabad lng
          renderLeafletMap('map', lat, lng, propertyDetails.title);
          trackRecentlyViewed(propertyDetails);

          // Setup desktop widgets
          setupDesktopWidgets();
        }
      } catch (err) {
        alert(err.message);
      }
    }

    function toggleComparison(property) {
      if (!property) return;
      try {
        const key = 'compare_list';
        let items = [];
        const raw = localStorage.getItem(key);
        if (raw) {
          items = JSON.parse(raw);
        }
        const exists = items.some(item => item.id == property.id);
        if (exists) {
          items = items.filter(item => item.id != property.id);
          localStorage.setItem(key, JSON.stringify(items));
          alert('Property removed from comparison list.');
          updateCompareButtonUI(false);
        } else {
          if (items.length >= 3) {
            alert('You can compare up to 3 properties at a time.');
            return;
          }
          items.push({
            id: property.id,
            title: property.title,
            price: property.price,
            city: property.city,
            cover_image: (property.images && property.images.length > 0) ? property.images[0].image_url : null
          });
          localStorage.setItem(key, JSON.stringify(items));
          alert('Property added to comparison list!');
          updateCompareButtonUI(true);
        }
      } catch (e) {
        console.error('Error toggling comparison:', e);
      }
    }

    function updateCompareButtonUI(isAdded) {
      const compBtn = document.getElementById('desktop-compare-btn');
      if (compBtn) {
        if (isAdded) {
          compBtn.innerHTML = `<i data-lucide="check"></i> Added to Compare`;
          compBtn.style.background = '#25D366';
        } else {
          compBtn.innerHTML = `<i data-lucide="git-compare"></i> Add to Compare`;
          compBtn.style.background = '';
        }
        if (window.lucide) window.lucide.createIcons();
      }
    }

    function setupDesktopWidgets() {
      if (window.innerWidth <= 768) return;

      // 1. Compare Button
      const compBtn = document.getElementById('desktop-compare-btn');
      if (compBtn && propertyDetails) {
        // Initialize compare button state
        const key = 'compare_list';
        const raw = localStorage.getItem(key);
        const items = raw ? JSON.parse(raw) : [];
        const isInCompare = items.some(item => item.id == propertyDetails.id);
        updateCompareButtonUI(isInCompare);

        compBtn.addEventListener('click', () => {
          toggleComparison(propertyDetails);
        });
      }

      // 2. Share Button
      const shareBtn = document.getElementById('desktop-share-btn');
      if (shareBtn) {
        shareBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(window.location.href)
            .then(() => alert('Property link copied to clipboard!'))
            .catch(() => alert('Failed to copy link.'));
        });
      }

      // 3. Recently Viewed details list (excluding current)
      const rv = localStorage.getItem('recently_viewed');
      const container = document.getElementById('desktop-recent-details-widget');
      if (container) {
        const items = rv ? JSON.parse(rv) : [];
        const filtered = items.filter(i => i.id != propertyId);
        
        if (filtered.length > 0) {
          container.innerHTML = filtered.slice(0, 3).map(p => `
            <a href="/details.html?id=${p.id}" style="display:flex; gap:10px; text-decoration:none; color:inherit; margin-top:8px;">
              <img src="${p.cover_image || 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=100&q=80'}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
              <div>
                <h5 style="font-size:12px; font-weight:700;">${p.title}</h5>
                <p style="font-size:11px; color:var(--primary-red);">₹${formatPrice(p.price)} • ${p.city}</p>
              </div>
            </a>
          `).join('');
        } else {
          container.innerHTML = `<p style="font-size:11px; color:var(--text-muted); margin-top:8px;">No other recently viewed listings.</p>`;
        }
      }
    }

    // Toggle and read favorites status
    async function checkFavStatus() {
      const user = localStorage.getItem('user');
      if (user && propertyDetails) {
        // Toggle active heart colors if saved in client list
      }
    }

    document.getElementById('details-fav-btn').addEventListener('click', async () => {
      if (!localStorage.getItem('token')) {
        return alert('Please login to save properties.');
      }
      try {
        const result = await apiRequest(`/api/properties/${propertyId}/save`, 'POST');
        if (result.success) {
          const btn = document.getElementById('details-fav-btn');
          const icon = btn.querySelector('i');
          if (result.saved) {
            btn.classList.add('active');
            icon.className = 'bx bxs-heart';
            alert('Listing saved successfully!');
          } else {
            btn.classList.remove('active');
            icon.className = 'bx bx-heart';
            alert('Listing removed from saved.');
          }
        }
      } catch (err) {
        alert(err.message);
      }
    });


    // Share action — uses Web Share API with full property details; falls back to clipboard
    function handleShareLink() {
      const title   = (propertyDetails && propertyDetails.title)   ? propertyDetails.title   : document.title;
      const price   = (propertyDetails && propertyDetails.price)   ? `₹${Number(propertyDetails.price).toLocaleString('en-IN')}` : '';
      const city    = (propertyDetails && propertyDetails.city)    ? propertyDetails.city    : '';
      const image   = (propertyDetails && propertyDetails.images && propertyDetails.images[0]) ? propertyDetails.images[0].image_url : '';
      const url     = window.location.href;

      const shareText = [title, price && `Price: ${price}`, city && `Location: ${city}`].filter(Boolean).join(' • ');

      if (navigator.share) {
        navigator.share({
          title: title,
          text:  shareText,
          url:   url
        }).catch(() => {
          // User cancelled or error — silently ignore
        });
      } else {
        // Fallback: copy URL to clipboard
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(() => {
            showToastMsg('Property link copied to clipboard!');
          });
        } else {
          // Last resort for older browsers
          const ta = document.createElement('textarea');
          ta.value = url;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToastMsg('Property link copied to clipboard!');
        }
      }
    }

    // Minimal toast helper (reuse existing if available, else create inline)
    function showToastMsg(msg) {
      if (typeof showToast === 'function') { showToast(msg); return; }
      const d = document.createElement('div');
      d.innerText = msg;
      Object.assign(d.style, { position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)', background:'#1a1a1a', color:'#fff', padding:'10px 18px', borderRadius:'20px', fontSize:'12px', fontWeight:'600', zIndex:'9999', opacity:'1', transition:'opacity 0.4s' });
      document.body.appendChild(d);
      setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 400); }, 2200);
    }

    let activeImageIndex = 0;

    function renderGallery() {
      const sliderImg = document.getElementById('slider-img-target');
      const thumbsContainer = document.getElementById('details-thumbnails-row');
      
      const images = propertyDetails?.images || [];
      if (images.length === 0) {
        sliderImg.src = 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80';
        thumbsContainer.innerHTML = '';
        return;
      }

      // Show active image
      sliderImg.style.opacity = 0;
      setTimeout(() => {
        const activeImgObj = images[activeImageIndex];
        sliderImg.src = window.SafeRender.safeImageUrl(activeImgObj ? activeImgObj.image_url : null);
        sliderImg.style.opacity = 1;
      }, 150);

      // Populate Thumbnails
      thumbsContainer.innerHTML = '';
      images.forEach((img, index) => {
        const thumb = document.createElement('div');
        thumb.style.cssText = `
          width: 60px;
          height: 60px;
          border-radius: 6px;
          overflow: hidden;
          cursor: pointer;
          flex-shrink: 0;
          border: 2px solid ${index === activeImageIndex ? 'var(--primary-red)' : 'transparent'};
          opacity: ${index === activeImageIndex ? '1' : '0.6'};
          transition: all 0.2s;
        `;
        const safeUrl = window.SafeRender.safeImageUrl(img ? img.image_url : null);
        thumb.innerHTML = `<img src="${safeUrl}" style="width:100%; height:100%; object-fit:cover;">`;
        thumb.addEventListener('click', () => {
          activeImageIndex = index;
          renderGallery();
        });
        thumbsContainer.appendChild(thumb);
      });
    }

    window.navigateDetailsImage = function(direction) {
      const images = propertyDetails?.images || [];
      if (images.length <= 1) return;
      activeImageIndex = (activeImageIndex + direction + images.length) % images.length;
      renderGallery();
    };

    function setupSwipeListeners() {
      const sliderContainer = document.getElementById('details-image-slider');
      if (!sliderContainer) return;
      
      let startX = 0;
      let endX = 0;
      
      sliderContainer.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
      }, { passive: true });
      
      sliderContainer.addEventListener('touchend', (e) => {
        endX = e.changedTouches[0].clientX;
        const threshold = 50;
        if (startX - endX > threshold) {
          navigateDetailsImage(1);
        } else if (endX - startX > threshold) {
          navigateDetailsImage(-1);
        }
      }, { passive: true });
    }

    function formatPrice(num) {
      if (num >= 10000000) return (num / 10000000).toFixed(1) + ' Cr';
      if (num >= 100000) return (num / 100000).toFixed(1) + ' L';
      return num.toLocaleString('en-IN');
    }
  </script>
</body>
