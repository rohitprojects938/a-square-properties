<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Property Reels - House Rental</title>
  <link rel="stylesheet" href="/css/style.v129.css">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <style>
    .reels-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #FF6A00;
      border-radius: 50%;
      animation: reelsSpin 0.8s linear infinite;
    }
    @keyframes reelsSpin {
      to { transform: rotate(360deg); }
    }
    /* Full height scrolling for Reels */
    .reels-wrapper {
      height: calc(100% - 88px); /* Full height minus fixed bottom nav */
      overflow: hidden !important; /* Lock native scrolling */
      background: #000;
      position: relative;
    }
    .reel-item {
      height: 100%;
      position: relative;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reel-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .reels-upload-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.98);
      z-index: 1000;
      display: none;
      padding: 24px;
      overflow-y: auto;
    }

    @media (min-width: 769px) {
      .reels-wrapper {
        grid-area: content;
        height: calc(100vh - 70px);
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #0b0b0b;
        overflow: hidden !important; /* Lock desktop native scroll too */
        padding: 20px 0;
        position: relative;
      }
      .reel-item {
        width: 360px;
        height: 600px;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 24px;
        flex-shrink: 0;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .reels-upload-overlay {
        grid-area: content;
        position: relative;
        height: calc(100vh - 70px);
        width: 100%;
        max-width: 600px;
        margin: 20px auto;
        border-radius: 16px;
        box-shadow: var(--premium-shadow);
      }
      #open-reel-upload-btn {
        right: 40px !important;
        top: 90px !important;
      }
    }

    /* Mobile specific reels upload scroll overrides */
    @media (max-width: 768px) {
      .reels-upload-overlay {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2000 !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
        background: #ffffff !important;
        display: none;
        padding-bottom: calc(88px + env(safe-area-inset-bottom) + 24px) !important;
      }
      #reel-preview-video {
        pointer-events: none !important;
        max-height: 280px !important;
        width: 100% !important;
        object-fit: contain !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" style="background:#000;">
    
    <!-- Floating Upload Option button -->
    <button id="open-reel-upload-btn" style="position:absolute; top:16px; right:16px; z-index:100; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.4); width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; cursor:pointer;" title="Upload Reel">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <!-- Reels scroll view -->
    <div class="reels-wrapper" id="reels-scroller">
      <!-- Generated dynamically -->
      <div class="reel-item" id="reel-placeholder">
        <p style="color:white; text-align:center;">Loading property reels feed...</p>
      </div>
    </div>

    <!-- Comments Slide-Up Sheet -->
    <div class="comments-pane" id="comments-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:8px;">
        <h4 style="font-size:14px; font-weight:700;">Comments</h4>
        <button onclick="toggleCommentsSheet(false)" style="background:none; border:none; font-size:20px; cursor:pointer;"><i class="bx bx-x"></i></button>
      </div>
      <div class="comments-list" id="reel-comments-list">
        <!-- comments populate here -->
      </div>
      <form onsubmit="handlePostComment(event)" style="display:flex; gap:8px; margin-top:8px;">
        <input type="text" id="comment-input" class="form-input" style="flex:1;" placeholder="Write a comment..." required>
        <button type="submit" class="btn-primary" style="width:auto; padding:10px 16px;"><i class="bx bx-paper-plane"></i></button>
      </form>
    </div>

    <!-- Reels Upload Overlay Form -->
    <div class="reels-upload-overlay" id="reels-upload-container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="color:var(--primary-red); font-size:20px; font-weight:700;">Upload Property Reel</h2>
        <button onclick="toggleUploadReel(false)" style="background:none; border:none; font-size:24px; color:var(--text-dark); cursor:pointer;"><i class="bx bx-x"></i></button>
      </div>
      <form onsubmit="handleUploadReel(event)" enctype="multipart/form-data">
        <div class="form-group">
          <label class="form-label">Select Reel Video (Portrait MP4 only)</label>
          <input type="file" id="reel-video-file" class="form-input" accept="video/mp4,video/quicktime" required>
        </div>
        <!-- Video Instant Preview Container -->
        <div class="form-group" id="reel-preview-wrapper" style="display:none; margin-bottom:16px; text-align:center; position:relative;">
          <video id="reel-preview-video" style="max-height:220px; width:auto; border-radius:12px; background:#000; box-shadow: 0 4px 15px rgba(0,0,0,0.15); pointer-events: none;" loop muted autoplay playsinline></video>
        </div>
        <div class="form-group">
          <label class="form-label">Caption / Description (Optional)</label>
          <textarea id="reel-caption-txt" class="form-input" rows="4" placeholder="Explore this beautiful villa! #houserenter #PremiumListing"></textarea>
        </div>
        <button type="submit" id="publish-reel-btn" class="btn-primary" style="margin-top:16px;">Publish Reel</button>
      </form>
    </div>

    <!-- Bottom tab nav -->
    <nav class="bottom-nav" style="background:rgba(0,0,0,0.85); border-top:1px solid rgba(255,255,255,0.15);">
      <a href="/index.html" class="nav-item" style="color:rgba(255,255,255,0.6);">
        <i class="bx bx-home"></i>
        <span>Home</span>
      </a>
      <a href="/search.html" class="nav-item" style="color:rgba(255,255,255,0.6);">
        <i class="bx bx-search-alt-2"></i>
        <span>Explore</span>
      </a>
      <div class="nav-item-center" id="center-add-btn" style="border-color:#000;">
        <i class="bx bx-plus"></i>
      </div>
      <a href="/search.html?gps=1" class="nav-item" style="color:rgba(255,255,255,0.6);">
        <i class="bx bx-compass"></i>
        <span>Nearby</span>
      </a>
      <a href="/profile.html" class="nav-item" style="color:rgba(255,255,255,0.6);">
        <i class="bx bx-user-circle"></i>
        <span>Profile</span>
      </a>
    </nav>
    
    <!-- Floating Bottom Sheet -->
    <div class="bottom-sheet-overlay" id="bottom-sheet-overlay"></div>
    <div class="bottom-sheet" id="bottom-sheet">
      <div class="bottom-sheet-handle"></div>
      <div class="bottom-sheet-header">
        <h2>Create New</h2>
        <button class="bottom-sheet-close" id="sheet-close"><i class="bx bx-x"></i></button>
      </div>
      <a href="/post.html" class="bottom-sheet-option">
        <div class="bottom-sheet-option-icon"><i class="bx bx-building-house"></i></div>
        <div class="bottom-sheet-option-text">
          <h3>Add Property</h3>
          <p>List a new property for sale, rent, or lease</p>
        </div>
        <i class="bx bx-chevron-right" style="margin-left:auto; color:var(--text-muted);"></i>
      </a>
      <a href="/reels.html?action=upload" class="bottom-sheet-option">
        <div class="bottom-sheet-option-icon"><i class="bx bx-video-plus"></i></div>
        <div class="bottom-sheet-option-text">
          <h3>Add Reel</h3>
          <p>Create and share a short vertical property video</p>
        </div>
        <i class="bx bx-chevron-right" style="margin-left:auto; color:var(--text-muted);"></i>
      </a>
    </div>

  </div>

  <script src="/js/main.v129.js"></script>
  <script>
    let reelsData = [];
    let currentReelIndex = 0;
    let selectedReelId = null;

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('action') === 'upload') {
        toggleUploadReel(true);
      }
      loadReelsFeed();
      
      // Premium Snap-Scroll Management for Reels (Mobile & Desktop)
      const scroller = document.getElementById('reels-scroller');
      let startY = 0;
      let isTouchActive = false;
      let isScrollingState = false;
      let wheelAccumulator = 0;

      // Snapping scroll executor
      window.scrollToReel = function(index) {
        if (index < 0 || index >= reelsData.length) return;
        currentReelIndex = index;
        isScrollingState = true;
        
        const reelItems = document.querySelectorAll('.reel-item');
        if (reelItems[index]) {
          reelItems[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
          playReelVideo(index);
        }
        
        setTimeout(() => {
          isScrollingState = false;
          wheelAccumulator = 0;
        }, 600); // 600ms transition lock
      };

      // Desktop wheel scroll handler
      scroller.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (isScrollingState) return;

        wheelAccumulator += e.deltaY;
        const threshold = 120; // Requires stronger intentional scroll input
        
        if (Math.abs(wheelAccumulator) >= threshold) {
          const direction = wheelAccumulator > 0 ? 1 : -1;
          const nextIndex = currentReelIndex + direction;
          scrollToReel(nextIndex);
        }
      }, { passive: false });

      // Mobile Touch Gestures
      scroller.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        isTouchActive = true;
      }, { passive: true });

      scroller.addEventListener('touchmove', (e) => {
        if (!isTouchActive) return;
        // Optionally lock screen during drag
      }, { passive: true });

      scroller.addEventListener('touchend', (e) => {
        if (!isTouchActive) return;
        isTouchActive = false;

        const endY = e.changedTouches[0].clientY;
        const deltaY = startY - endY; // positive means swiped UP (next reel)
        const threshold = 100; // Enforce intentional swipe

        if (Math.abs(deltaY) >= threshold) {
          const direction = deltaY > 0 ? 1 : -1;
          const nextIndex = currentReelIndex + direction;
          scrollToReel(nextIndex);
        }
      }, { passive: true });
    });

    // Toggle comments panel
    function toggleCommentsSheet(show, reelId = null) {
      const sheet = document.getElementById('comments-sheet');
      if (show) {
        selectedReelId = reelId;
        sheet.classList.add('active');
        loadReelComments(reelId);
      } else {
        sheet.classList.remove('active');
      }
    }

    // Toggle upload overlay panel
    function toggleUploadReel(show) {
      const overlay = document.getElementById('reels-upload-container');
      if (show) {
        if (!localStorage.getItem('token')) {
          alert('Login required to upload property reels.');
          window.location.href = '/login.html';
          return;
        }
        overlay.style.display = 'block';
        
        // Pause all background video feeds to silence voice output
        const videos = document.querySelectorAll('.reel-video');
        videos.forEach(vid => vid.pause());
      } else {
        overlay.style.display = 'none';
        
        // Resume playing current reel video when overlay form is closed
        const videos = document.querySelectorAll('.reel-video');
        if (videos[currentReelIndex]) {
          videos[currentReelIndex].play().catch(() => {});
        }
      }
    }

    document.getElementById('open-reel-upload-btn').addEventListener('click', () => toggleUploadReel(true));

    // Fetch reels from API
    async function loadReelsFeed() {
      try {
        const result = await apiRequest('/api/properties/feed/reels');
        if (result.success) {
          reelsData = result.data;
          renderReels();
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Render HTML feeds
    function renderReels() {
      const wrapper = document.getElementById('reels-scroller');
      wrapper.innerHTML = '';
      if (reelsData.length === 0) {
        wrapper.innerHTML = `
          <div class="reel-item" style="color:white; flex-direction:column; gap:12px;">
            <i class="bx bx-movie-play" style="font-size:48px; color:var(--text-muted);"></i>
            <p>No property video reels available yet.</p>
          </div>
        `;
        return;
      }

      reelsData.forEach((r, idx) => {
        const item = document.createElement('div');
        item.className = 'reel-item';
        item.innerHTML = `
          <video class="reel-video" src="${r.video_url}" loop playsinline onerror="handleVideoError(this)" onclick="togglePlayState(this)"></video>
          <div class="reel-overlay-play"><i class="bx bx-play"></i></div>
          
          <!-- Actions -->
          <div class="reel-actions">
            <button class="reel-action-btn ${r.is_liked ? 'active' : ''}" onclick="handleLikeReel(${r.id}, this)">
              <i class="${r.is_liked ? 'bx bxs-heart' : 'bx bx-heart'}"></i>
              <span>${r.likes_count}</span>
            </button>
            <button class="reel-action-btn" onclick="toggleCommentsSheet(true, ${r.id})">
              <i class="bx bx-comment-detail"></i>
              <span>${r.comments ? r.comments.length : 0}</span>
            </button>
            <button class="reel-action-btn" onclick="handleShareReel('${r.video_url}')">
              <i class="bx bx-share"></i>
              <span>Share</span>
            </button>
          </div>

          <!-- Description info -->
          <div class="reel-info">
            <div class="reel-creator">
              ${window.AvatarSystem.renderHtml({ name: r.creator_name, profile_photo: r.creator_pic }, 'reel-creator-img')}
              <span class="reel-creator-name">${r.creator_name}</span>
            </div>
            <p class="reel-caption">${r.caption}</p>
          </div>
        `;
        wrapper.appendChild(item);
      });

      // Play first video automatically
      setTimeout(() => playReelVideo(0), 500);
    }

    function playReelVideo(idx) {
      // Do not play any reel audio/video if the upload form is active
      const overlay = document.getElementById('reels-upload-container');
      if (overlay && overlay.style.display === 'block') {
        return;
      }

      currentReelIndex = idx;
      const videos = document.querySelectorAll('.reel-video');
      videos.forEach((vid, i) => {
        if (i === idx) {
          vid.muted = false; // Play unmuted by default
          const playPromise = vid.play();
          if (playPromise !== undefined) {
            playPromise.catch((error) => {
              console.warn("Autoplay with audio was blocked, falling back to muted autoplay:", error);
              vid.muted = true;
              vid.play().catch(() => {});
            });
          }
        } else {
          vid.pause();
        }
      });
    }

    function togglePlayState(vid) {
      const playIcon = vid.parentElement.querySelector('.reel-overlay-play');
      
      // First click unmutes the video (matching Instagram)
      if (vid.muted) {
        vid.muted = false;
        if (vid.paused) {
          vid.play().catch(() => {});
        }
        playIcon.style.opacity = 0;
        return;
      }

      if (vid.paused) {
        vid.play().catch(() => {});
        playIcon.style.opacity = 0;
      } else {
        vid.pause();
        playIcon.style.opacity = 1;
        setTimeout(() => { playIcon.style.opacity = 0; }, 1000);
      }
    }

    function handleVideoError(vid) {
      console.warn("Reel video failed to load:", vid.src);
      const parent = vid.parentElement;
      if (parent.querySelector('.video-error-fallback')) return;
      
      const errorDiv = document.createElement('div');
      errorDiv.className = 'video-error-fallback';
      errorDiv.style.cssText = 'position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#111; color:#fff; gap:12px; font-size:14px; z-index:2;';
      errorDiv.innerHTML = `
        <i class="bx bx-video-off" style="font-size:48px; color:var(--text-muted);"></i>
        <p>Video unavailable</p>
      `;
      vid.style.display = 'none';
      parent.appendChild(errorDiv);
    }

    // Like Action (Optimistic UI Update)
    async function handleLikeReel(rid, btn) {
      if (!localStorage.getItem('token')) {
        return alert('Login required to like video reels.');
      }

      const icon = btn.querySelector('i');
      const countSpan = btn.querySelector('span');
      
      const isCurrentlyLiked = btn.classList.contains('active');
      const currentCount = parseInt(countSpan.innerText) || 0;

      // Optimistic update
      const newLikedState = !isCurrentlyLiked;
      const newCount = newLikedState ? (currentCount + 1) : Math.max(0, currentCount - 1);

      btn.classList.toggle('active', newLikedState);
      icon.className = newLikedState ? 'bx bxs-heart' : 'bx bx-heart';
      countSpan.innerText = newCount;

      try {
        const result = await apiRequest(`/api/properties/feed/reels/${rid}/like`, 'POST');
        if (result.success) {
          // Sync with exact server count
          if (typeof result.likesCount === 'number') {
            countSpan.innerText = result.likesCount;
          }
          btn.classList.toggle('active', result.liked);
          icon.className = result.liked ? 'bx bxs-heart' : 'bx bx-heart';
          
          // Keep reelsData state in sync
          const reelItem = reelsData.find(r => r.id === rid);
          if (reelItem) {
            reelItem.is_liked = result.liked;
            reelItem.likes_count = result.likesCount;
          }
        } else {
          // Revert optimistic update
          btn.classList.toggle('active', isCurrentlyLiked);
          icon.className = isCurrentlyLiked ? 'bx bxs-heart' : 'bx bx-heart';
          countSpan.innerText = currentCount;
        }
      } catch (err) {
        // Revert optimistic update
        btn.classList.toggle('active', isCurrentlyLiked);
        icon.className = isCurrentlyLiked ? 'bx bxs-heart' : 'bx bx-heart';
        countSpan.innerText = currentCount;
        alert(err.message);
      }
    }

    // Load Comments list inside Slideup sheet
    function loadReelComments(rid) {
      const commentsList = document.getElementById('reel-comments-list');
      commentsList.innerHTML = '';
      
      const reel = reelsData.find(r => r.id === rid);
      if (reel && reel.comments && reel.comments.length > 0) {
        reel.comments.forEach(c => {
          const row = document.createElement('div');
          row.className = 'comment-item';
          row.innerHTML = `
            ${window.AvatarSystem.renderHtml({ name: c.user_name, profile_photo: c.user_pic }, 'comment-avatar')}
            <div class="comment-details">
              <h5>${c.user_name}</h5>
              <p>${c.comment_text}</p>
            </div>
          `;
          commentsList.appendChild(row);
        });
      } else {
        commentsList.innerHTML = '<p style="font-size:12px; color:var(--text-muted); text-align:center; padding:16px;">No comments yet.</p>';
      }
    }

    // Post comment logic
    async function handlePostComment(e) {
      e.preventDefault();
      const txt = document.getElementById('comment-input').value;
      if (!localStorage.getItem('token')) {
        return alert('Login required to post comments.');
      }

      try {
        const result = await apiRequest(`/api/properties/feed/reels/${selectedReelId}/comment`, 'POST', { commentText: txt });
        if (result.success) {
          alert('Comment posted!');
          document.getElementById('comment-input').value = '';
          toggleCommentsSheet(false);
          loadReelsFeed();
        }
      } catch(err) {
        alert(err.message);
      }
    }

    // Listen to video choice for instant preview
    document.getElementById('reel-video-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const wrapper = document.getElementById('reel-preview-wrapper');
      const video = document.getElementById('reel-preview-video');
      
      if (file) {
        if (file.size > 30 * 1024 * 1024) {
          alert('Video file size exceeds 30MB limit.');
          e.target.value = '';
          wrapper.style.display = 'none';
          video.src = '';
          return;
        }
        if (!file.name.toLowerCase().endsWith('.mp4') && !file.name.toLowerCase().endsWith('.mov')) {
          alert('Please select a portrait MP4 or MOV video file.');
          e.target.value = '';
          wrapper.style.display = 'none';
          video.src = '';
          return;
        }
        
        const previewUrl = URL.createObjectURL(file);
        video.src = previewUrl;
        wrapper.style.display = 'block';
        video.load();
      } else {
        wrapper.style.display = 'none';
        video.src = '';
      }
    });

    // Reusable upload handler using XHR to track real progress
    function xhrUpload(url, method, formData, onProgress, onLoad, onError) {
      const xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      
      const token = localStorage.getItem('token');
      if (token) {
        xhr.setRequestHeader('Authorization', `Bearer ${token}`);
      }
      
      xhr.upload.addEventListener('progress', (e) => {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          onProgress(percent);
        }
      });

      xhr.addEventListener('load', () => {
        let result = {};
        try {
          result = JSON.parse(xhr.responseText);
        } catch (e) {}

        if (xhr.status >= 200 && xhr.status < 300) {
          onLoad(result);
        } else {
          const errMsg = result.error || 'Server returned error status ' + xhr.status;
          onError(new Error(errMsg));
        }
      });

      xhr.addEventListener('error', () => {
        onError(new Error('Network request failed. Please check your connection.'));
      });

      xhr.send(formData);
    }

    // Upload Reel action dispatcher
    function handleUploadReel(e) {
      e.preventDefault();
      const videoFile = document.getElementById('reel-video-file').files[0];
      const caption = document.getElementById('reel-caption-txt').value;
      const publishBtn = document.getElementById('publish-reel-btn');

      if (!videoFile) {
        return alert('Please select a video file.');
      }

      // Prevent duplicate clicks
      publishBtn.disabled = true;
      publishBtn.innerText = 'Publishing...';

      // Setup Progress state
      const progressModal = document.getElementById('reels-progress-modal');
      const progressText = document.getElementById('reels-progress-text');
      const progressBar = document.getElementById('reels-progress-bar');
      const progressPercent = document.getElementById('reels-progress-percent');

      progressText.innerText = 'Preparing upload...';
      progressBar.style.width = '0%';
      progressPercent.innerText = '0%';
      progressModal.style.display = 'flex';

      const formData = new FormData();
      formData.append('video', videoFile);
      formData.append('caption', caption || '');

      xhrUpload(
        '/api/properties/feed/reels',
        'POST',
        formData,
        // OnProgress
        (percent) => {
          if (percent < 100) {
            progressText.innerText = 'Uploading reel...';
          } else {
            progressText.innerText = 'Processing...';
          }
          progressBar.style.width = percent + '%';
          progressPercent.innerText = percent + '%';
        },
        // OnLoad / Success
        (result) => {
          progressText.innerText = 'Finalizing...';
          progressBar.style.width = '100%';
          progressPercent.innerText = '100%';
          
          setTimeout(() => {
            progressModal.style.display = 'none';
            alert('Reel uploaded successfully!');
            
            // Clean/Reset input form
            document.getElementById('reel-video-file').value = '';
            document.getElementById('reel-caption-txt').value = '';
            document.getElementById('reel-preview-wrapper').style.display = 'none';
            document.getElementById('reel-preview-video').src = '';
            
            publishBtn.disabled = false;
            publishBtn.innerText = 'Publish Reel';
            
            toggleUploadReel(false);
            loadReelsFeed();
          }, 600);
        },
        // OnError
        (err) => {
          progressModal.style.display = 'none';
          alert('Upload failed: ' + err.message);
          
          // Re-enable button to allow retry
          publishBtn.disabled = false;
          publishBtn.innerText = 'Publish Reel';
        }
      );
    }

    function handleShareReel(url) {
      navigator.clipboard.writeText(window.location.origin + url);
      alert('Video reel share link copied to clipboard!');
    }
  </script>

  <!-- Reels Upload Progress Modal -->
  <div id="reels-progress-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:99999; display:none; flex-direction:column; align-items:center; justify-content:center; color:white; padding:24px; font-family:'Outfit', sans-serif;">
    <div style="width:100%; max-width:320px; text-align:center; background:#1a1d27; padding:28px 24px; border-radius:16px; border:1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <div class="reels-spinner" style="margin:0 auto 20px auto; width:48px; height:48px; border-width:4px;"></div>
      <div id="reels-progress-text" style="font-size:16px; font-weight:600; margin-bottom:12px;">Preparing upload...</div>
      <div style="background:rgba(255,255,255,0.1); height:6px; border-radius:3px; overflow:hidden; margin-bottom:8px;">
        <div id="reels-progress-bar" style="background:linear-gradient(90deg, #FF6A00 0%, #ff9040 100%); width:0%; height:100%; transition:width 0.2s ease;"></div>
      </div>
      <div id="reels-progress-percent" style="font-size:12px; color:#8b90a0;">0%</div>
    </div>
  </div>
</body>
</html>
